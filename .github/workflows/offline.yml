name: Offline workflows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -e .
          python -m pip install pytest -r examples/debug-extraction/requirements.txt
      - name: Run tests including real frame ingestion
        run: python -m pytest -q
      - name: Execute offline workflows with connections blocked
        run: python -m scripts.verify_offline --output runs/ci-offline
      - name: Preserve reports and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-python-${{ matrix.python }}
          path: runs/ci-offline/
          if-no-files-found: warn
          retention-days: 14
