[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapped-procedure-pipeline"
version = "0.1.0"
description = "Evidence-grounded CREOLab protocol and apparatus planning"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["pydantic>=2.12,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
e2e = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "playwright>=1.49,<2"]
design = ["caid-forma-core==0.3.6", "cadquery>=2.6,<3"]
# yourdfpy 0.0.58 uses an array-to-scalar conversion removed by newer NumPy.
robot = ["yourdfpy==0.0.58", "trimesh==5.2.0", "numpy==2.3.5"]
# Install OpenCAD from the pinned source revision in examples/so101-fixture/README.md.
fixture = ["cadquery==2.7.0"]

[tool.setuptools.packages.find]
include = ["protocol_pipeline*"]

[tool.setuptools.package-data]
protocol_pipeline = ["*.mts", "*.mjs", "*.tsx", "web_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["runs", "snapshots", ".git", ".venv", "node_modules"]

