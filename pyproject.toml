[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapped-procedure-pipeline"
version = "0.1.0"
description = "Evidence-grounded CREOLab protocol and apparatus planning"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
design = ["caid-forma-core==0.3.6"]

[tool.setuptools.packages.find]
include = ["protocol_pipeline*"]

[tool.setuptools.package-data]
protocol_pipeline = ["*.mts", "web_static/*"]

